[package]
name = "local-study-notebook"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
printpdf = "0.7.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# Git work-tree status + file diffs (Work-Tree panel). Only local operations, so
# network features (ssh/https, openssl) are disabled to keep Windows builds clean.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Google Drive backup (BACKUP-0): OAuth 2.0 (PKCE) + Drive API client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
url = "2"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
tiny_http = "0.12"

[lib]
name = "local_study_notebook_lib"
crate-type = ["lib", "cdylib", "staticlib"]
