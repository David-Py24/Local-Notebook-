name: Release

# Push a tag like "v1.2.1" to trigger this: builds, code-signs the update package with
# TAURI_SIGNING_PRIVATE_KEY, and publishes a draft GitHub Release containing the
# installer(s) plus a latest.json manifest — which is exactly what tauri.conf.json's
# updater.endpoints points at, so a signed release published here is what the in-app
# "Check for Updates" button will find. The release is left as a draft; publish it
# manually on GitHub once you've reviewed it.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            # Explicit CLI flag, not just tauri.conf.json's bundle.targets — v1.2.2's
            # release still produced an MSI alongside the NSIS installer despite the
            # config-only restriction, which is what breaks latest.json generation
            # (tauri-action can't disambiguate which installer the updater manifest
            # should reference). Forcing it here is the belt-and-suspenders fix.
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # v0 (resolves to the 0.6.x line) has a confirmed bug where latest.json generation
      # silently skips with "Signature not found for the updater JSON. Skipping upload..."
      # even when .sig files were correctly created on disk — reproduced twice (v1.2.2,
      # v1.2.3) against action-v0.6.2. v1.0.0's release notes describe an internal rewrite
      # of exactly the asset-detection logic latest.json generation depends on. None of
      # this workflow's `with:` inputs were renamed/removed by v1's breaking changes.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Local Study Notebook ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
